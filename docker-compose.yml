# VPS (kendi sunucunuz) için alternatif kurulum. Kullanım:
#   cp .env.example .env   (değerleri doldurun)
#   docker compose up -d --build
# Caddy, alan adınız için HTTPS sertifikasını kendiliğinden alır.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: alkanka
      POSTGRES_USER: alkanka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlanmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alkanka -d alkanka"]
      interval: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://alkanka:${POSTGRES_PASSWORD}@db:5432/alkanka
    command: ["npm", "run", "start:render"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://alkanka:${POSTGRES_PASSWORD}@db:5432/alkanka
    command: ["npm", "run", "worker:telegram"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN .env içinde tanımlanmalı}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
