<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alkanka · Alternatif yön: Masa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --felt:#0F5A44; --felt-d:#0A3D2F;
  --paper:#F3F0E8; --card:#FFFDF8; --ink:#16201B;
  --red:#D13A2E; --gold:#E7B03A; --gold-d:#9A6A0E;
  --mut:rgba(22,32,27,.62); --line:rgba(22,32,27,.11);
  --stage:#E2DDD0;
  --fh:'Bricolage Grotesque',system-ui,sans-serif;
  --fb:'Manrope',system-ui,sans-serif;
  --tb:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
svg.lucide{width:18px;height:18px;flex-shrink:0;stroke-width:2}
.ic-s svg.lucide,svg.lucide.ic-s{width:15px;height:15px}
.ic-l svg.lucide,svg.lucide.ic-l{width:22px;height:22px}

/* ---------- toolbar ---------- */
.tool{height:var(--tb);display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tool::-webkit-scrollbar{display:none}
.tool .ttl{display:flex;flex-direction:column;flex-shrink:0;line-height:1.25}
.tool .ttl b{font-family:var(--fh);font-size:16px;font-weight:800}
.tool .ttl span{font-size:12px;color:var(--mut)}
.seg{display:flex;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;flex-shrink:0}
.seg button{height:32px;padding:0 12px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--mut)}
.seg button.on{background:var(--felt);color:var(--paper)}
.tool .grow{flex:1}

/* ---------- stage & frames ---------- */
.stage{height:calc(100vh - var(--tb));display:flex;gap:24px;justify-content:center;align-items:center;padding:16px}
#f-web{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 20px 50px -20px rgba(22,32,27,.35),0 0 0 1px var(--line)}
#f-web .bar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--paper);border-bottom:1px solid var(--line)}
#f-web .bar i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
#f-web .bar .url{margin:0 auto;height:24px;padding:0 14px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
#f-mob{width:410px;flex-shrink:0;height:min(864px,100%);padding:10px;border-radius:50px;background:var(--ink);box-shadow:0 30px 60px -24px rgba(22,32,27,.55)}
#f-mob .screen{height:100%;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;background:var(--felt-d)}
#f-mob .status{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:var(--paper);font-size:13px;font-weight:700}
#f-mob .status span{display:flex;gap:5px;align-items:center}
#f-mob .cq{width:390px}
.cq{container-type:inline-size;container-name:app;flex:1;min-height:0;width:100%}
body[data-view=web] #f-mob{display:none}
body[data-view=mob] #f-web{display:none}
@media (max-width:460px){
  .stage{padding:0}
  #f-mob{width:100%;height:100%;padding:0;border-radius:0}
  #f-mob .screen{border-radius:0}
  #f-mob .cq{width:100%}
}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
.side{display:none;flex-direction:column;background:var(--felt);color:var(--paper);min-height:0}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.tg{display:none}
.scrim{display:none}
.d-only{display:none !important}
@container app (min-width:1000px){
  .side{display:flex;width:248px;flex-shrink:0}
  .m-only{display:none !important}
  .d-only{display:flex !important}
}
@container app (min-width:1400px){
  .tg{display:flex;width:300px;flex-shrink:0}
}
.app.drawer .side{display:flex;position:absolute;inset:0 auto 0 0;width:min(300px,86%);z-index:60;box-shadow:20px 0 40px rgba(0,0,0,.3)}
.app.drawer .scrim{display:block;position:absolute;inset:0;background:rgba(10,20,15,.5);z-index:55}

/* sidebar */
.side .logo{padding:18px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .logo img{width:176px;height:auto;max-width:100%}
.side .close{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:none;align-items:center;justify-content:center}
.app.drawer .side .close{display:flex}
.side .snav{flex:1;overflow-y:auto;padding:0 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;min-height:0}
.ucard{margin:0 12px 10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.ucard .r{display:flex;align-items:center;gap:10px;min-width:0}
.ucard img{width:40px;height:40px;border-radius:12px;object-fit:cover;flex-shrink:0}
.ucard b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard small{display:block;font-size:12px;opacity:.7}
.xp{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.xp i{display:block;height:100%;background:var(--gold);border-radius:6px}
.xpl{display:flex;justify-content:space-between;font-size:11px;opacity:.75}
.ucard .btn{width:100%}
.shd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:700;padding:14px 10px 6px}
.ni{width:100%;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;font-weight:600;font-size:14px;text-align:left;color:rgba(243,240,232,.9)}
.ni:hover{background:rgba(255,255,255,.07)}
.ni.on{background:var(--paper);color:var(--felt-d);font-weight:800}
.ni .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .live{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--red);color:var(--paper);letter-spacing:.04em}
.ni .cnt{min-width:20px;height:20px;border-radius:6px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.tgmini{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.18);width:100%;text-align:left}
.tgmini img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.tgmini b{display:block;font-size:13px}
.tgmini small{display:block;font-size:11px;opacity:.7}

/* header */
.promo{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.promo .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.promo .gold{color:var(--gold);font-weight:800;flex-shrink:0}
.top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:440px;min-width:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--mut);font-size:13px}
.search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{font-family:var(--fb);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.top .grow{flex:1}
.pill{height:40px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0}
.coin{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.coin .plus{width:20px;height:20px;border-radius:6px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.av{width:40px;height:40px;border-radius:12px;object-fit:cover;flex-shrink:0}

/* mobile header */
.mtop{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px 12px;background:var(--felt-d);color:var(--paper)}
.mtop .menu{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mtop .lg{width:112px;height:auto}
.mtop .grow{flex:1;min-width:0}
.mtop .coin{height:36px;padding:0 10px;border:0;background:rgba(0,0,0,.28)}
.mtop .av{width:36px;height:36px;border-radius:11px}
.mtop .sm{height:36px;padding:0 12px;border-radius:11px;font-weight:800;font-size:13px;white-space:nowrap}
.mpromo{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;white-space:nowrap}
.mpromo .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mpromo .gold{color:var(--gold);font-weight:800}

/* scroll area */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;container-type:inline-size;container-name:main;scrollbar-width:thin;scrollbar-color:rgba(22,32,27,.2) transparent}
.pad{padding:24px 28px 48px;display:flex;flex-direction:column;gap:28px}
@container app (max-width:999.98px){ .pad{padding:16px 16px 100px;gap:24px} }

/* tab bar (mobile) */
.tabbar{flex-shrink:0;display:flex;justify-content:space-around;padding:8px 6px 18px;background:var(--card);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 0;min-width:0}
.tabbar button span{white-space:nowrap}
.tabbar button.on{color:var(--felt)}
.tabbar button.on .tbi{background:var(--felt);color:var(--paper)}
.tbi{width:40px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative}
.tbi .cnt{position:absolute;top:-4px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:5px;background:var(--red);color:var(--paper);font-size:10px;display:flex;align-items:center;justify-content:center}

/* ---------- primitives ---------- */
.btn{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;flex-shrink:0}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.red{background:var(--red);color:var(--paper);box-shadow:0 3px 0 #9E2A21}
.btn.red:active{transform:translateY(2px);box-shadow:0 1px 0 #9E2A21}
.btn.felt{background:var(--felt);color:var(--paper)}
.btn.ghost{background:rgba(243,240,232,.12);color:var(--paper);border:1px solid rgba(243,240,232,.28)}
.btn.line{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.off{background:var(--paper);color:var(--mut);border:1px dashed var(--line);cursor:default}
.btn.w{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.mut{color:var(--mut)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh h2{font-family:var(--fh);font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.sh p{font-size:13px;color:var(--mut);margin-top:2px}
.sh .more{font-weight:800;font-size:13px;color:var(--felt);display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
@container app (max-width:999.98px){ .sh h2{font-size:19px} }
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--fh);font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.ph p{color:var(--mut);margin-top:6px;max-width:560px;text-wrap:pretty}
@container app (max-width:999.98px){ .ph h1{font-size:28px} }
.badge{font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge.red{background:var(--red);color:var(--paper)}
.badge.gold{background:var(--gold);color:var(--ink)}
.badge.felt{background:var(--felt);color:var(--paper)}
.badge.paper{background:var(--card);color:var(--ink)}
.ldot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.on-dot{width:7px;height:7px;border-radius:50%;background:#2E9E62;display:inline-block;flex-shrink:0}
.bar6{height:6px;border-radius:6px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar6 i{display:block;height:100%;background:var(--felt);border-radius:6px}

/* okey taşı — signature */
.tas{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:30px;height:40px;padding:0 7px;border-radius:7px;background:linear-gradient(180deg,#FFFEF9 0%,#F1EBDA 100%);border:1px solid #D9CFB6;box-shadow:0 3px 0 #C9BC9C,0 5px 10px -4px rgba(22,32,27,.35);font-family:var(--fh);font-weight:800;font-size:17px;line-height:1;color:var(--ink);flex-shrink:0}
.tas::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tas.r{color:var(--red)} .tas.g{color:var(--felt)} .tas.y{color:var(--gold-d)} .tas.k{color:var(--ink)}
.tas.sm{min-width:24px;height:32px;font-size:14px;padding:0 5px;border-radius:6px;box-shadow:0 2px 0 #C9BC9C,0 4px 8px -4px rgba(22,32,27,.35)}
.tas.sm::after{width:4px;height:4px}
.tas.lg{min-width:46px;height:60px;font-size:26px;border-radius:9px}
/* taş-butonlar: filtre / sekme */
.tiles{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:4px}
@container app (max-width:999.98px){ .tiles{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none} .tiles::-webkit-scrollbar{display:none} }
.tb{height:40px;padding:0 16px;border-radius:9px;background:linear-gradient(180deg,#FFFEF9 0%,#F1EBDA 100%);border:1px solid #D9CFB6;box-shadow:0 3px 0 #C9BC9C;font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0;transition:transform .1s}
.tb small{font-size:11px;color:var(--mut);font-weight:700}
.tb.on{background:var(--felt);border-color:var(--felt-d);color:var(--paper);box-shadow:0 1px 0 var(--felt-d);transform:translateY(2px)}
.tb.on small{color:rgba(243,240,232,.75)}

/* ---------- home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--felt-d);color:var(--paper)}
.track{display:flex;transition:transform .7s cubic-bezier(.6,.05,.25,1)}
.slide{flex:0 0 100%;position:relative;min-height:390px;display:flex;align-items:center}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--felt-d) 0%,rgba(10,61,47,.92) 34%,rgba(10,61,47,.25) 62%,rgba(10,61,47,0) 80%)}
.slide.s0{background:#0E5B44}
.slide.s0>img{left:auto;width:60%;object-position:88% center}
.slide.s0 .shade{left:auto;width:60%;background:linear-gradient(90deg,#0E5B44 0%,rgba(14,91,68,0) 22%)}
.slide.s0 .txt{max-width:44%}
.slide .txt{position:relative;padding:44px 44px 64px;max-width:540px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.slide h1{font-family:var(--fh);font-size:44px;font-weight:800;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
.slide p{font-size:15px;opacity:.88;max-width:420px;text-wrap:pretty}
.slide .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.livetag{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}
.livetag .tas{color:var(--red)}
.dots{position:absolute;left:44px;bottom:24px;display:flex;gap:6px;z-index:2}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(243,240,232,.4);transition:width .3s}
.dots button.on{width:26px;background:var(--gold)}
.arrows{position:absolute;right:20px;bottom:20px;gap:8px;z-index:2}
.arrows button{width:40px;height:40px;border-radius:12px;background:rgba(10,61,47,.7);border:1px solid rgba(243,240,232,.2);display:flex;align-items:center;justify-content:center;color:var(--paper)}
@container main (max-width:699.98px){
  .slide{flex-direction:column;align-items:stretch;min-height:0}
  .slide>img,.slide.s0>img{position:static;width:100%;height:196px;object-position:72% center}
  .slide.s0 .txt{max-width:none}
  .slide .shade{display:none}
  .slide .txt{padding:18px 18px 46px;max-width:none;gap:10px}
  .slide h1{font-size:27px}
  .slide p{font-size:14px}
  .slide .acts{width:100%}
  .slide .acts .btn{flex:1}
  .dots{left:18px;bottom:20px}
}

.ticker{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;overflow:hidden}
.ticker .lb{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:var(--felt);color:var(--paper);font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}
.tkv{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tkr{display:flex;gap:28px;width:max-content;animation:mq 38s linear infinite}
.tkr span{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.tkr img{width:22px;height:22px;border-radius:7px;object-fit:cover}
.tkr b{font-weight:800}
.tkr em{font-style:normal;color:var(--felt);font-weight:800}
@keyframes mq{to{transform:translateX(-50%)}}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container main (min-width:700px){ .quick{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px} }
.qt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px;text-align:left;min-width:0}
.qt .qi{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--paper);flex-shrink:0}
.qt .qi img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.qt b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.qt small{display:block;font-size:12px;color:var(--mut);line-height:1.35}
.qt .w{min-width:0;width:100%}

.tables{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container main (min-width:700px){ .tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;min-width:0}
.trow .th{width:54px;height:54px;border-radius:13px;object-fit:cover;flex-shrink:0}
.trow .inf{flex:1;min-width:0}
.trow .inf b{display:block;font-size:14px;font-weight:800}
.trow .inf small{display:block;font-size:12px;color:var(--mut)}
.seats{display:flex;gap:4px;flex-shrink:0}
.seats i{width:22px;height:22px;border-radius:7px;border:1.5px dashed rgba(22,32,27,.25);display:block;overflow:hidden}
.seats i.f{border:0}
.seats img{width:100%;height:100%;object-fit:cover}
@container main (max-width:380px){ .seats i{width:18px;height:18px;border-radius:6px} }

  const days=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let body='';
  if(S.gtab==='gorev') body=`<div class="tasks">${TASKS.map((t,i)=>{const done=t.p>=t.n,cl=S.claimed[i];
    const act=S.guest?`<button class="btn line sm" data-act="login">Giriş yap</button>`:cl?`<button class="btn off sm" disabled>${ic('check','ic-s')}Alındı</button>`:done?`<button class="btn red sm" data-act="claim" data-v="${i}">Ödülü al</button>`:`<button class="btn line sm" data-act="${t.go?'tg':'soon'}">Git</button>`;
    return `<div class="card task"><span class="ti">${ic(t.i)}</span><div class="w"><div class="t1"><b>${t.t}</b><span class="rw">+${t.r} KC</span></div><div class="pr"><div class="bar6"><i style="width:${t.p/t.n*100}%"></i></div><small>${t.p}/${t.n}</small></div></div><div class="act">${act}</div></div>`}).join('')}</div>`;
  if(S.gtab==='turnuva') body=`<div class="tours">${TOURS.map(t=>`<div class="card tour"><div class="im"><img src="${I(t.g)}" alt=""><span class="badge ${t.b[1]}">${t.b[0]}</span></div><div class="bd"><b>${t.n}</b><div class="meta"><span>${ic('calendar','ic-s')} ${t.t}</span><span>${t.p}/${t.n2} kanka</span></div><div class="bar6"><i style="width:${t.p/t.n2*100}%"></i></div><div class="prize"><span>Ödül ${fmt(t.pr)} KC</span><button class="btn felt sm" data-act="soon">Katıl</button></div></div></div>`).join('')}</div>`;
  if(S.gtab==='tahmin') body=`<div class="preds">${PREDS.map((p,i)=>`<div class="card pred"><div class="m"><b class="ell">${p.m}</b><small>${p.t}</small></div><div class="opts">${['1','X','2'].map((o,j)=>`<button class="opt ${S.picks[i]===o?'on':''}" data-act="pick" data-i="${i}" data-v="${o}"><small>${o}</small><b>${p.o[j]}</b></button>`).join('')}</div></div>`).join('')}</div>
    <p class="mut" style="font-size:13px">Doğru tahmin başına 100 KC, haftanın birincisine 2.000 KC. Oranlar sponsor bilgisidir, Kanka Coin ile oynanır.</p>`;
  if(S.gtab==='bilet') body=`<div class="tickets">
    <div class="card tkt"><span class="tas lg r">3</span><div class="w"><b>Pazar büyük çekilişi</b><small>3 biletin var · çekiliş Pazar 22:00</small></div><button class="btn felt sm" data-act="soon">Detay</button></div>
    <div class="card tkt"><span class="tas lg g">1</span><div class="w"><b>Turnuva giriş bileti</b><small>Pazar Okey Kupası için geçerli</small></div><button class="btn line sm" data-act="soon">Kullan</button></div></div>`;
  return `
  <section class="ghero"><div><h1>Görev Merkezi</h1><p>${S.guest?'Görevleri tamamla, Kanka Coin topla.':'Bugün 3/7 görev tamamlandı · 5 günlük seri'}</p></div>
    <div class="streak" aria-label="Haftalık seri">${days.map((d,i)=>`<span class="d"><span class="tas ${i<5?'y':'no'}">${i<5?'✓':i+1}</span>${d}</span>`).join('')}</div></section>
  <div class="tiles" role="tablist">${tabs.map(([k,l,c])=>`<button class="tb ${S.gtab===k?'on':''}" role="tab" aria-selected="${S.gtab===k}" data-act="gtab" data-v="${k}">${l}<small>${c}</small></button>`).join('')}</div>
  ${body}`;
}

function Market(){
  const cats=['Tümü','Çerçeve','Avatar','Tema','Sandık','Sponsor'];
  const list=S.mf==='Tümü'?MARKET:MARKET.filter(m=>m.c===S.mf);
  return `
  <div class="ph"><div><h1>Market</h1><p>Kanka Coin'lerini çerçeve, avatar, masa teması ve sponsor hediyelerine çevir.</p></div></div>
  ${S.guest?`<div class="card bal"><img src="${I('coin')}" alt=""><div class="w"><small>Kayıt ol, başla</small><b>500 KC hediye</b></div><button class="btn red sm" data-act="register">Kayıt ol</button></div>`:
  `<div class="card bal"><img src="${I('coin')}" alt=""><div class="w"><small>Bakiyen</small><b>${fmt(BAL)} KC</b></div><button class="btn line sm" data-go="gorevler">KC kazan</button></div>`}
  <div class="tiles" role="tablist">${cats.map(c=>`<button class="tb ${S.mf===c?'on':''}" role="tab" aria-selected="${S.mf===c}" data-act="mf" data-v="${c}">${c}</button>`).join('')}</div>
  <div class="mgrid">${list.map(m=>{const ok=m.p<=BAL;
    const b=S.guest?`<button class="btn line" data-act="login">Giriş yap</button>`:ok?`<button class="btn felt" data-act="buy" data-v="${m.n}">Satın al</button>`:`<button class="btn off" disabled>${fmt(m.p-BAL)} KC eksik</button>`;
    return `<div class="card mi"><div class="im"><img class="${m.cover?'cover':''}" src="${I(m.i)}" alt="${m.n}" loading="lazy">${m.b?`<span class="badge ${m.b[1]}">${m.b[0]}</span>`:''}</div><div class="bd"><small>${m.c}</small><b>${m.n}</b><div class="price"><i></i>${fmt(m.p)} KC</div>${b}</div></div>`}).join('')}</div>`;
}

function Siralama(){
  const tabs=['Haftalık','Aylık','Tüm zamanlar'];
  const p=[LB[1],LB[0],LB[2]];
  return `
  <div class="ph"><div><h1>Sıralama</h1><p>Her el, görev ve turnuva puan getirir. Hafta sonunda ilk 10'a KC ödülü.</p></div></div>
  <div class="tiles" role="tablist">${tabs.map(t=>`<button class="tb ${S.ltab===t?'on':''}" role="tab" aria-selected="${S.ltab===t}" data-act="ltab" data-v="${t}">${t}</button>`).join('')}</div>
  <div class="podium">${p.map((l,i)=>{const r=[2,1,3][i];return `<div class="card pod p${r}"><span class="tas ${r===1?'y':r===2?'k':'r'}">${r}</span><img src="${I(l[1])}" alt=""><b>${l[0]}</b><small>${fmt(l[2])} puan</small></div>`}).join('')}</div>
  <div class="card lb">${LB.slice(3).map((l,i)=>`<div class="lrow ${l[0]==='krsonee'&&!S.guest?'me':''}"><span class="tas sm ${l[0]==='krsonee'?'y':'k'}">${i+4}</span><img src="${I(l[1])}" alt=""><span class="n ell">${l[0]}<span class="sub">${l[0]==='krsonee'&&!S.guest?'Sen · ilk 3\'e 11.230 puan':l[3]}</span></span><span class="p">${fmt(l[2])}</span></div>`).join('')}</div>`;
}

function Profil(){
  if(S.guest) return `<div class="card gate"><img src="${I('jako-masa')}" alt=""><div class="w"><span class="badge gold">PROFİL</span><h2>Profilini görmek için giriş yap.</h2><p class="mut">Seviyen, rozetlerin, maç geçmişin ve Kanka Coin bakiyen burada.</p><div class="acts"><button class="btn red" data-act="register">Ücretsiz kayıt ol</button><button class="btn line" data-act="login">Giriş yap</button></div></div></div>`;
  const ms=[['okey','Okey · Salon 4','Kazandın · 1. sıra','+200 KC','win'],['tavla','Tavla · Hızlı maç','Kaybettin · 3-5','−100 KC','lose'],['pisti','Pişti · Tek el','Kazandın · 168 sayı','+80 KC','win'],['okey101','101 Okey · Salon 2','Kazandın · eşli','+300 KC','win'],['batak','Batak · Koz maça','Kaybettin · 2. sıra','−150 KC','lose']];
  return `
  <div><div class="cover"><img src="${I('profile-cover')}" alt=""></div>
  <div class="phead"><img class="pav" src="${I('av1')}" alt="krsonee"><div class="w"><h1>krsonee</h1><p><span class="tas sm y">12</span>Seviye 12 · Altın lig · 46 kanka</p></div>
    <div class="acts"><button class="btn line sm" data-act="soon">${ic('pencil','ic-s')}Düzenle</button><button class="btn felt sm" data-act="soon">${ic('share-2','ic-s')}Paylaş</button></div></div></div>
  <div class="card panel"><div class="hd"><h3>Seviye 13'e</h3><span style="font-weight:800;font-size:13px">1.240 / 2.000 XP</span></div><div class="bar6" style="height:10px"><i style="width:62%;background:var(--gold)"></i></div></div>
  <section class="stats">${[['Oynanan el','1.284'],['Kazanma oranı','%58'],['Rozet','23'],['Toplam KC','28.640']].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>${b}</b></div>`).join('')}</section>
  <section>${sh('Rozetler','23 / 40 açıldı','Tümü','profil')}<div class="badges">${[['tier-bronz','Bronz'],['tier-altin','Altın'],['tier-elmas','Elmas'],['tier-efsane','Efsane',1]].map(([i,n,l])=>`<div class="card bdg ${l?'lock':''}"><img src="${I(i)}" alt=""><b>${n}${l?' · kilitli':''}</b></div>`).join('')}</div></section>
  <section>${sh('Son maçlar')}<div class="card matches">${ms.map(m=>`<div class="mrow"><img src="${I(m[0])}" alt=""><div class="w"><b class="ell">${m[1]}</b><small class="ell">${m[2]}</small></div><span class="res ${m[4]}">${m[3]}</span></div>`).join('')}</div></section>`;
}

const SCR={home:Home,oyunlar:Oyunlar,gorevler:Gorevler,market:Market,siralama:Siralama,profil:Profil};
function App(id){
  return `<div class="app ${S.drawer[id]?'drawer':''}">${Side(id)}<div class="scrim" data-act="drawer" data-frame="${id}"></div>
    <div class="mainwrap">${Header(id)}<div class="scroll"><div class="pad">${SCR[S.screen]()}</div></div>${Tabbar()}</div>${Tg()}</div>`;
}
const FR={web:document.getElementById('cq-web'),mob:document.getElementById('cq-mob')};
function render(keep){
  for(const id in FR){
    const old=FR[id].querySelector('.scroll'),st=keep&&old?old.scrollTop:0;
    FR[id].innerHTML=App(id);
    const sc=FR[id].querySelector('.scroll'); if(sc) sc.scrollTop=st;
  }
  document.getElementById('url').textContent='alkanka.com'+SCREENS.find(s=>s[0]===S.screen)[2];
  document.querySelectorAll('#seg-screen button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.screen));
  document.querySelectorAll('#seg-view button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  document.querySelectorAll('#seg-user button').forEach(b=>b.classList.toggle('on',(b.dataset.user==='guest')===S.guest));
  document.body.dataset.view=S.view;
  if(window.lucide) lucide.createIcons();
}
document.getElementById('seg-screen').innerHTML=SCREENS.map(([k,l])=>`<button data-go="${k}">${l}</button>`).join('');

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
function setSlide(i){S.slide=(i+3)%3;document.querySelectorAll('.track').forEach(t=>t.style.transform=`translateX(-${S.slide*100}%)`);document.querySelectorAll('.dots').forEach(d=>[...d.children].forEach((b,j)=>b.classList.toggle('on',j===S.slide)));document.querySelectorAll('.slide').forEach((s,j)=>s.setAttribute('aria-hidden',j%3!==S.slide))}
let timer=setInterval(()=>{if(S.screen==='home')setSlide(S.slide+1)},6500);

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;render(true);return}
  const u=e.target.closest('[data-user]');if(u){S.guest=u.dataset.user==='guest';render(true);return}
  const g=e.target.closest('[data-go]');
  if(g){const k=g.dataset.go;
    if(!SCR[k]){toast('Bu ekran yön onaylanınca aynı stilde çizilecek');return}
    S.screen=k;if(g.dataset.tab)S.gtab=g.dataset.tab;S.drawer={web:false,mob:false};render(false);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,val=a.dataset.v;
  switch(act){
    case 'drawer':S.drawer[a.dataset.frame]=!S.drawer[a.dataset.frame];render(true);break;
    case 'gf':S.gf=val;render(true);break;
    case 'mf':S.mf=val;render(true);break;
    case 'gtab':S.gtab=val;render(true);break;
    case 'ltab':S.ltab=val;render(true);break;
    case 'tgtab':S.tgtab=val;render(true);break;
    case 'pick':S.picks[a.dataset.i]=val;render(true);break;
    case 'claim':S.claimed[val]=1;render(true);toast('Ödül hesabına eklendi');break;
    case 'slide':setSlide(+val);break;
    case 'next':setSlide(S.slide+1);break;
    case 'prev':setSlide(S.slide-1);break;
    case 'play':toast(`${val}: masa aranıyor…`);break;
    case 'buy':toast(`${val} satın alındı`);break;
    case 'tg':toast('Telegram kanalı açılıyor');break;
    case 'login':toast('Giriş ekranı açılır');break;
    case 'register':toast('Kayıt ekranı açılır · +500 KC');break;
    default:toast('Mockup: bu buton canlı sitede çalışır');
  }
});
function fit(){document.documentElement.style.setProperty('--tb',document.querySelector('.tool').offsetHeight+'px')}
addEventListener('resize',fit);fit();
if(innerWidth<900)S.view='mob';
render(false);
</script>
</body>
</html>
